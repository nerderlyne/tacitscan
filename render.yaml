databases:
  - name: tacitscan-db
    databaseName: tacitscan
    user: tacitscan
    plan: basic-256mb
    region: ohio

services:
  - type: web
    name: tacitscan-frontend
    runtime: node
    plan: starter
    region: ohio
    rootDir: frontend
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    healthCheckPath: /api/live
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: tacitscan-db
          property: connectionString
      - key: PUBLIC_SITE_NAME
        value: tacitscan
      - key: PUBLIC_NETWORK
        value: mainnet

  - type: worker
    name: tacitscan-indexer
    runtime: node
    plan: starter
    region: ohio
    rootDir: indexer
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm start
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: DATABASE_URL
        fromDatabase:
          name: tacitscan-db
          property: connectionString
      - key: BITCOIN_NETWORK
        value: mainnet
      - key: START_HEIGHT
        value: "948241"
      - key: CONFIRMATION_DEPTH
        value: "3"
      - key: BITCOIN_RPC_URL
        sync: false
      - key: ESPLORA_URL
        value: https://mempool.space/api
      - key: ESPLORA_FALLBACK_URL
        value: https://blockstream.info/api
